name: Import pinned upstream Git objects

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  import:
    name: Import reviewed upstream snapshot into a temporary ref
    if: github.repository == 'azatakmyradov/t3code' && github.ref == 'refs/heads/sync/import-upstream-1f093d119'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout temporary import branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch and verify pinned upstream commit
        shell: bash
        run: |
          set -euo pipefail
          expected=1f093d119b91263deb83f0d18e1504b791fdbbd4
          git fetch --no-tags https://github.com/pingdotgg/t3code.git "$expected"
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$expected"
          git cat-file -e "$expected^{commit}"
          git push origin "$expected:refs/heads/sync/upstream-source-1f093d119"
          test "$(git ls-remote origin refs/heads/sync/upstream-source-1f093d119 | cut -f1)" = "$expected"
